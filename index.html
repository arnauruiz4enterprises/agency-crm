<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Layout idea: gold rail on the left, dark working surface, dense Airtable-like lists driven by config. */
:root{
  --page:#0a0a0a;--band:#141414;--chrome:#0f0f0f;--border:#3a3a3a;--line:#2a2a2a;
  --text:#fafafa;--text2:#9a9a9a;--hover:#161616;--accent:#d4af37;--accent-ink:#0a0a0a;--link:#6cb6ff;
  --sel:#d4af3724;--danger:#e5484d;--ok:#20c933;--chip-bg:#24262b;--chip-fg:#aab2c0;
  --rail:#d4af37;--rail-ink:#0a0a0a;--rail-hover:#0000001a;--rail-active:#00000029;
  --good-bg:#1d4a2a;--bad-bg:#5a2024;--warn-bg:#5a4212;--scrim:#00000099;
  --font:"Geist",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-t="light"]{
  --page:#fff;--band:#f4f4f4;--chrome:#fff;--border:#c4c4c4;--line:#e4e4e4;--text:#0a0a0a;--text2:#5c5c5c;
  --hover:#f5f5f5;--sel:#d4af372e;--chip-bg:#eef0f6;--chip-fg:#3d4759;--good-bg:#dff5e3;--bad-bg:#fde3e4;--warn-bg:#fdefd2;--link:#0b62c4;--scrim:#00000059;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font:13px/1.45 var(--font);display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--border);padding:6px 10px;color:var(--text)}
button:where(:not(.ma *)):hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
input,select,textarea{background:var(--chrome);border:1px solid var(--border);padding:6px 8px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn-acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-acc:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{color:var(--danger);border-color:var(--danger)}

/* rail */
#rail{width:232px;flex:none;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;height:100%}
#rail .brand{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:15px}
#rail .logo{width:24px;height:24px;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-size:12px;font-weight:700}
#rail nav{flex:1;overflow:auto;padding:4px 8px 12px}
#rail .sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 8px 6px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
#rail a.nav{display:flex;gap:10px;align-items:center;color:var(--rail-ink);padding:8px 10px 8px 28px;font-weight:500;border-left:3px solid transparent}
#rail a.nav:hover{background:var(--rail-hover);text-decoration:none}
#rail a.nav.on{background:var(--rail-active);border-left-color:var(--rail-ink);font-weight:700}
#rail .soon{padding:7px 10px 7px 28px;opacity:.55;display:flex;justify-content:space-between}
#rail .soon small{font-size:10px;border:1px solid currentColor;padding:0 5px}
#rail .me{border-top:1px solid #00000026;padding:12px 14px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
#rail .me .who{flex:1;min-width:120px;overflow-wrap:anywhere}
#rail .me button{border-color:#00000040;color:var(--rail-ink);padding:4px 8px;font-size:12px}
#rail .me button:hover{background:var(--rail-hover)}
#rail .av{width:28px;height:28px;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
#scrim{display:none}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--chrome);flex:none}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{color:var(--text2);font-size:12px}
header .sp{flex:1}
#menuBtn{display:none}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;background:var(--chrome)}
.tabs a{color:var(--text2);padding:8px 14px;border:1px solid transparent;border-bottom:none;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs a.on{color:var(--text);font-weight:600;border-color:var(--line);background:var(--page)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#view{flex:1;overflow:auto;padding:0 0 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.fbtn{display:flex;gap:6px;align-items:center;padding:6px 10px;max-width:100%}
.fbtn b{font-weight:600}.fbtn span.op{color:var(--text2)}
.badge{background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:0 5px;margin-left:4px}
.plain{border-color:transparent}
.chip{display:inline-block;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 3px 1px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.g{background:var(--chip-bg);color:var(--chip-fg);font-weight:500}
.muted{color:var(--text2)}
.empty{padding:28px 16px;color:var(--text2)}
.foot{position:sticky;bottom:0;background:var(--chrome);border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--text2);margin-top:8px}
.foot b{color:var(--text)}

/* list */
.lv{min-width:100%;width:max-content}
.lhead,.lrow{display:grid;grid-template-columns:var(--cols);align-items:stretch;border-bottom:1px solid var(--line)}
.lhead{position:sticky;top:0;background:var(--band);z-index:2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);font-weight:600}
.lhead>div,.lrow>div{padding:8px 10px;border-right:1px solid var(--line);min-width:0;overflow:hidden}
.lrow>div{max-height:66px;overflow:hidden;overflow-wrap:anywhere}
.lv.rh-short .lrow>div{max-height:38px;white-space:nowrap;text-overflow:ellipsis}
.lv.rh-short .lrow>div>span:last-child{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.lv.rh-short .lrow .t span{white-space:nowrap}
.lv.rh-short .lrow>div>span:last-child>*{flex:none}
.lv.rh-tall .lrow>div{max-height:none}
.lv.rh-tall .lrow>div>span:last-child{display:flex;gap:4px;flex-wrap:wrap}
.lrow:hover{background:var(--hover)}
.lrow .t{font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.lrow .t span{overflow:hidden;text-overflow:ellipsis}
.lrow .t button{padding:1px 6px;font-size:11px;flex:none;opacity:.6}
.lrow:hover .t button{opacity:1}
.cell[data-e]{cursor:cell}
.cell.ro{color:var(--text2)}
.cell.good{background:var(--good-bg)}.cell.bad{background:var(--bad-bg)}.cell.warn{background:var(--warn-bg)}
.selc{display:flex;align-items:flex-start;justify-content:center;padding:10px 0!important}.selc input{width:auto;margin:0}
.lrow.picked{background:var(--sel)}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--accent);color:var(--accent-ink);flex-basis:100%}
.bulkbar button{background:var(--chrome);color:var(--text)}
.alertbar{position:sticky;left:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bad-bg);border-bottom:1px solid var(--line);font-size:13px}
.navbadge{margin-left:auto;background:#f82b60;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px}
.sres{max-height:60vh;overflow:auto;margin-top:8px}.sres .sh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding:8px 4px 4px}
.sres .si{display:flex;gap:8px;align-items:center;padding:7px 8px;cursor:pointer;border-radius:4px}.sres .si:hover,.sres .si.on{background:var(--hover)}.sres .si small{color:var(--text2);margin-left:auto}
.grip{cursor:grab;border:none;background:none;font-size:18px;line-height:1;color:var(--text2);padding:4px 8px;justify-self:start}.grip:active{cursor:grabbing}
.fe-row.dragging{opacity:.4}.fe-row.dropt{box-shadow:inset 0 3px 0 var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel)}
.lrow.editing>div{background:var(--sel);box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.lrow .cell a{color:var(--link,#4da3ff);text-decoration:underline;text-underline-offset:2px}
.pop.longpop{position:fixed;z-index:60;padding:0;max-width:none;max-height:none;overflow:hidden;display:flex;flex-direction:column}.pop.longpop textarea{min-width:0}
.lp-head{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.lp-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line)}.lp-tools button{min-width:32px}
.lp-link{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line)}.lp-link[hidden]{display:none}.lp-link input{flex:1;min-width:0}
.cell.csel,.lrow .t.csel{background:color-mix(in srgb,var(--accent) 14%,transparent)!important}.lrow .t.csel.ct{box-shadow:inset 0 2px 0 var(--accent)}.lrow .t.csel.cb{box-shadow:inset 0 -2px 0 var(--accent)}.lrow .t.csel.ct.cb{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}.lrow .t.csel.cl{box-shadow:inset 2px 0 0 var(--accent)}.cell.csel.ct{box-shadow:inset 0 2px 0 var(--accent)}.cell.csel.cb{box-shadow:inset 0 -2px 0 var(--accent)}.cell.csel.ct.cb{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}.cell.csel.cl{border-left:2px solid var(--accent)}.cell.csel.cr{border-right:2px solid var(--accent)}
.lv .cell[data-k]{user-select:none}.acc-open{cursor:pointer}.acc-open:hover{text-decoration:underline}
#accdr{position:fixed;top:0;right:0;bottom:0;width:min(1180px,62vw);z-index:35;background:var(--page);border-left:1px solid var(--border);box-shadow:-20px 0 50px #0005;display:flex;flex-direction:column}
@media(max-width:900px){#accdr{width:100vw}}
.fc-top{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.fc-top button{border-radius:8px}
.fc-body{flex:1;overflow:auto;padding:0 22px 30px;position:relative}
.fc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 8px}.fc-head h1{margin:0;font-size:28px;border-left:4px solid var(--accent);padding-left:12px}.fc-head a{font-weight:600}
.fc-tabs{position:sticky;top:0;z-index:3;background:var(--page);display:flex;flex-wrap:wrap;gap:2px 18px;border-bottom:1px solid var(--line);padding:4px 0}.fc-tabs button{font-weight:600;color:var(--text2);padding:8px 2px;border:0;border-bottom:2px solid transparent;border-radius:0}.fc-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.fc-sec{padding:18px 0;border-bottom:1px solid var(--line)}.fc-sec h2{font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
.fc-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.fc-t{font-size:18px;letter-spacing:.04em}.fc-cust{display:inline-flex;gap:6px;align-items:center}.fc-cust input{width:auto}.fc-upl{font-size:12px;color:var(--text2)}
.fc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.fc-kpi{border:1px solid var(--line);padding:12px;text-align:center}.fc-kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);min-height:28px}.fc-kpi .v{font-size:22px;font-weight:700;margin:4px 0}.fc-kpi .d{font-size:12px;font-weight:700}.d.good{color:#2e9e57}.d.bad{color:var(--danger)}
.fc-box{border:1px solid var(--line);padding:14px}.fc-minis{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}.fc-mini{border:1px solid var(--line);padding:8px 16px;text-align:center;min-width:120px}.fc-mini.t{display:flex;align-items:center;font-weight:700;font-size:16px}.fc-mini .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}.fc-mini .v{font-size:20px;font-weight:700}.fc-minis .btn-acc{margin-left:auto;align-self:center}
.fc-chartrow{display:grid;grid-template-columns:1fr 230px;gap:16px}@media(max-width:1100px){.fc-chartrow{grid-template-columns:1fr}}
.fcchart{width:100%;height:auto;display:block}.fcchart .grid{stroke:var(--line)}.fcchart .ax{font-size:11px;fill:var(--text2)}.fcchart .axt{font-size:11px;font-weight:700;fill:var(--text2)}.fcchart .rb{fill:#3b6fd4}.fcchart .bar:hover .rb{fill:#5b8ff4}.fcchart .ls{fill:none;stroke:var(--text);stroke-width:2}.fcchart .ps{fill:var(--text)}.fcchart .lv{fill:none;stroke:#5ccfff;stroke-width:2;stroke-dasharray:5 4}.fcchart .pv{fill:#5ccfff}.fcchart .note{stroke:var(--accent);stroke-dasharray:3 3}.fcchart .flag text{fill:var(--accent);font-size:13px}
.fc-sl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:700;margin:12px 0 4px}
.fcstrip{display:grid;gap:3px;margin-left:6.4%;margin-right:10.9%}.fcstrip.psr{padding-top:13px}.fcstrip .sq{height:16px;background:var(--line);border-radius:2px}
.fcstrip .psb{display:flex;flex-direction:column;height:30px;position:relative;justify-content:flex-end;gap:1px}.fcstrip .psb i{display:block;min-height:2px;border-radius:1px}.fcstrip .pl{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;color:var(--text2)}.fcstrip .ps0{height:30px}
i.pd{background:#4cc35e}i.pm{background:#e8455f}i.pp{background:#f0b43c}
.fc-legs{display:grid;gap:14px;align-content:start}.fc-leg{font-size:12px;display:grid;gap:4px}.fc-leg .lt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text2)}.fc-leg i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px}.fc-note button{padding:0 4px;border:0}
.fc-tbl{border:1px solid var(--line);overflow:auto}.fc-tr{display:grid;grid-template-columns:130px 130px 130px 150px 190px 190px 100px 100px 80px 80px;align-items:center;border-bottom:1px solid var(--line);min-width:1150px;cursor:pointer}.fc-tr>div{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc-th{background:var(--band);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);cursor:default;position:sticky;top:0}.fc-tr:not(.fc-th):hover{background:var(--hover)}.fc-tr .fc-tw{display:inline-block;width:16px;font-size:10px;color:var(--text2)}
.fc-vt .fc-tr{grid-template-columns:60px 1fr 110px 110px 60px 100px;min-width:600px;cursor:default}.fc-vt .vprev{width:30px;height:40px}
.fc-sub{padding:8px 14px 10px 36px;background:var(--band);border-bottom:1px solid var(--line);display:grid;gap:6px;min-width:1150px}.fc-task{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;padding:3px 0}
.fc-vbars{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line)}.fc-vbars .vb{flex:1;height:100%;display:flex;align-items:flex-end}.fc-vbars i{display:block;width:100%;background:#8b6fe0;border-radius:2px 2px 0 0}.fc-vax{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px}
.fc-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.fc-two{grid-template-columns:1fr}}
.fc-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 24px}.fc-info>div{display:grid;gap:2px;border-bottom:1px solid var(--line);padding-bottom:6px;overflow-wrap:anywhere}.fc-info .muted{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.fc-demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.fc-dr{display:grid;grid-template-columns:90px 1fr 44px;gap:6px;align-items:center;font-size:12px}.fc-dr i{display:block;height:8px;background:var(--accent);border-radius:4px}
.fc-cm{padding:8px 0;border-bottom:1px solid var(--line)}
.fc-foot{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--band)}.fc-foot input{flex:1;border:0;background:transparent}.fc-av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.fc-vleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:8px}.fc-vleg i,.fc-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;flex:none}.fc-dv .fc-tr{grid-template-columns:140px 160px 160px 1fr;min-width:600px}.fc-dv .fc-sub{min-width:600px}
#appupd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:400;display:flex;gap:12px;align-items:center;background:#1f2937;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 8px 30px #0006;font-size:14px;max-width:calc(100vw - 24px)}#appupd button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.kopen{padding:2px 8px;font-size:12px;white-space:nowrap}
.kdoc-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--page);z-index:2}

.kback{margin-bottom:18px}

.kcall{display:flex;gap:10px;padding:12px 16px;margin:10px 0 14px;border-radius:6px;background:var(--band)}.kcall .ki{font-size:18px;line-height:1.4}.kcall>div{flex:1;min-width:0}.kcall p:last-child,.kcall ul:last-child{margin-bottom:0}
.kcall.beige{background:rgba(212,175,55,.15)}.kcall.blue{background:rgba(59,130,246,.14)}.kcall.yellow{background:rgba(234,179,8,.16)}.kcall.red{background:rgba(239,68,68,.14)}.kcall.green{background:rgba(34,197,94,.14)}

.ktitle-in{font-size:24px;font-weight:700;margin-bottom:4px}.kedit{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kedit .kmd{min-height:60vh;font:13px/1.5 ui-monospace,monospace}.kedit .kbody{border:1px solid var(--line);padding:12px 16px;max-height:70vh;overflow:auto}

/* popover + modal */
.fe-list{max-height:52vh;overflow:auto;border:1px solid var(--line);margin-bottom:10px}

.pop{position:fixed;z-index:50;background:var(--chrome);border:1px solid var(--border);min-width:200px;max-width:320px;max-height:340px;overflow:auto;box-shadow:0 12px 32px #0008;padding:6px}

.pop .row{display:flex;gap:6px;padding:6px 4px 2px}
#modal{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}

.dlg{background:var(--chrome);border:1px solid var(--border);width:min(720px,100%);padding:18px 20px}

.dlg .f input[type=checkbox]{width:auto;margin-top:8px}
.dlg .acts{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--page);padding:8px 14px;z-index:60;display:none;font-weight:600;max-width:90vw}

/* plan, cards, calendar, board */
.wrap{padding:16px;max-width:1100px}
.wrap h2{font-size:20px;margin:22px 0 10px}
.anchors{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;left:0;z-index:5;background:var(--chrome)}

.hint{color:var(--text2);font-size:12px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{border:1px solid var(--line);background:var(--band);padding:12px 14px}

.kpi .row{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
.kpi .row input{font-size:12px;font-weight:500;width:110px}
table.simple{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.q{margin:10px 0}.q label{display:block;font-weight:600;margin-bottom:4px}.q textarea{min-height:56px}
.week{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.day{border:1px solid var(--line);margin:8px 12px}

.cards:empty{display:none}
.card{background:var(--band);border-left:3px solid var(--accent);padding:8px 10px;cursor:pointer}
.card:hover{background:var(--hover)}
.card b{display:block}.card small{color:var(--text2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;padding:12px;overflow-x:auto}
.bcol{border:1px solid var(--line);background:var(--chrome);min-height:120px}
.bcol>h3{margin:0;padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.bcol .card{margin:6px}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 16px}
.abox{border:1px solid var(--line);background:var(--band);padding:12px 14px;min-width:0}.abox.wide{grid-column:1/-1}
.abox .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}

.svgc svg{display:block;width:100%;height:auto;max-height:340px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:8px}.legend span{display:inline-flex;gap:6px;align-items:center}.legend i,.sharerow i{width:10px;height:10px;border-radius:50%;flex:none}

.srcdot{margin-left:6px;font-size:11px;color:var(--link)}
@media (max-width:760px){.agrid{grid-template-columns:1fr}}
.chart{padding:14px 16px}

/* model app (Content Hub) */

.ma-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ma-stat{background:#fffbea;border-radius:12px;padding:10px 12px}
.ma-stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}

.ma-h{font-size:12px;letter-spacing:.08em;color:var(--ma-sub);text-transform:uppercase;font-weight:600;margin:22px 0 10px}
.ma-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    nav.append(h('a',{class:'nav'+(st.route===k?' on':''),href:'#'+k,onclick:e=>{if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();go(k)}},PAGES[k].icon?h('span',null,PAGES[k].icon):null,PAGES[k].title,k==='pipeline'&&lowN?h('span',{class:'navbadge',title:lowN+' cuentas con menos de 2 días de contenido'},lowN):null))})});

  const page=PAGES[st.route]||PAGES.accounts;const isMA=st.route==='modelapp'&&m;$('#title').textContent=isMA?'📱 '+m.name:page.title;$('#subtitle').textContent=isMA?'App de '+m.name+' · solo ve su propio contenido':(page.global||!m?'':m.name+' · ')+page.sub;document.title=(s.agency||'Agency')+' CRM';

  const v=$('#view');const keep=v.scrollTop,keepX=v.scrollLeft;v.replaceChildren();v.style.setProperty('--tbh','0px');if(S.role!=='model'&&['pipeline','plan','content'].includes(st.route)){const ab=alertBar();if(ab)v.append(ab)}const node=tab||page;const key=st.route+'/'+(tab?tab.id:'');

function authScreen(mode,msg,isErr){const a=$('#auth');a.classList.add('on');const name=window.AGENCY_NAME||'Agency CRM';
  const email=h('input',{id:'au_email',type:'email',autocomplete:'email',required:true}),pw=h('input',{id:'au_pw',type:'password',autocomplete:mode==='signup'?'new-password':'current-password',required:mode!=='reset',minlength:mode==='signup'?'8':null});
  const note=h('div',{class:'auth-msg'+(isErr?' err':''),role:'status'},msg||'');
  const btn=h('button',{type:'submit',class:'btn-acc',style:'width:100%;padding:10px;margin-top:8px'},mode==='signup'?'Crear cuenta':mode==='reset'?'Enviar email':'Entrar');
  const say=(t,err)=>{note.textContent=t;note.className='auth-msg'+(err?' err':'')};
  const submit=async e=>{e.preventDefault();say('');btn.disabled=true;try{
      if(mode==='reset'){const {error}=await S.sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin});if(error)throw error;say('Te hemos enviado un email para cambiar la contraseña.')}
      else if(mode==='signup'){const {data,error}=await S.sb.auth.signUp({email:email.value.trim(),password:pw.value});if(error)throw error;if(!data||!data.session)say('Cuenta creada. Revisa tu email para confirmarla y después inicia sesión.')}
      else{const {error}=await S.sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error)throw error}
    }catch(x){const m=(x&&x.message)||'';say(m==='Invalid login credentials'?'Email o contraseña incorrectos.':m==='Email not confirmed'?'Confirma tu email antes de entrar (revisa tu bandeja).':(m||'Algo falló. Inténtalo de nuevo.'),true)}finally{btn.disabled=false}};
  a.replaceChildren(h('div',{class:'auth-card'},
    h('div',{class:'auth-head'},h('span',{class:'auth-logo'},name.slice(0,1).toUpperCase()),h('div',null,h('b',{style:'font-size:16px;display:block'},mode==='signup'?'Crear cuenta':mode==='reset'?'Recuperar contraseña':'Iniciar sesión'),h('span',{class:'muted',style:'font-size:12px'},name))),
    h('form',{class:'auth-box',onsubmit:submit},h('label',{for:'au_email'},'Email'),email,mode==='reset'?null:[h('label',{for:'au_pw'},'Contraseña'),pw],btn,note),
    h('div',{class:'auth-links'},mode==='login'?[h('span'),h('button',{type:'button',onclick:()=>authScreen('reset')},'¿Olvidaste la contraseña?')]:h('button',{type:'button',onclick:()=>authScreen('login')},'← Volver a iniciar sesión'))));
  email.focus()}
function gateScreen(title,text){const a=$('#auth');a.classList.add('on');a.replaceChildren(h('div',{class:'auth-card'},h('div',{class:'auth-box'},h('b',{style:'font-size:15px'},title),h('p',{class:'muted',style:'margin:4px 0 10px'},text),h('button',{type:'button',onclick:()=>S.sb.auth.signOut()},'Cerrar sesión'))))}
let starting=false;
async function startSession(session){if(starting||S.user)return;starting=true;
  const {data:prof,error}=await S.sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();starting=false;
  if(error||!prof){gateScreen('No encontramos tu perfil','Si acabas de crear la cuenta, espera unos segundos y vuelve a entrar. Si sigue pasando, contacta con tu agencia.');return}
  S.user=session.user;S.profile=prof;S.role=prof.role;
  if(prof.role==='admin')S.sb.from('profiles').select('user_id,email,display_name,role').then(({data})=>{S.people=data||[];rerender()});
  if(S.role==='model'&&!prof.model_id){gateScreen('Cuenta pendiente de activar','Tu cuenta está creada. Tu agencia tiene que activarla y asignarte tu perfil. Vuelve a entrar cuando te avisen.');return}
  const a=$('#auth');a.classList.remove('on');a.replaceChildren();
  if(S.role==='model')Object.assign(ma,{screen:'home',reset:true});else parseHash();
  render();initStore()}
async function boot(){
  if(!window.SB_URL){parseHash();render();initStore();return}
  if(!window.supabase||!window.supabase.createClient){document.body.replaceChildren(h('div',{class:'empty',style:'margin:auto'},'No se pudo cargar la conexión con la base de datos. Revisa tu conexión y recarga la página.'));return}
  S.sb=window.supabase.createClient(window.SB_URL,window.SB_KEY);
  S.sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){try{history.replaceState(null,'',location.pathname)}catch(e){}location.reload()}else if(ev==='SIGNED_IN'&&session&&!S.user)startSession(session);else if(ev==='PASSWORD_RECOVERY')recoverScreen()});
  const {data}=await S.sb.auth.getSession();if(data&&data.session)startSession(data.session);else authScreen('login')}
function recoverScreen(){const a=$('#auth');a.classList.add('on');const pw=h('input',{id:'au_new',type:'password',autocomplete:'new-password',minlength:'8',required:true});const note=h('div',{class:'auth-msg',role:'status'});
  a.replaceChildren(h('div',{class:'auth-card'},h('form',{class:'auth-box',onsubmit:async e=>{e.preventDefault();const {error}=await S.sb.auth.updateUser({password:pw.value});if(error){note.textContent=error.message;note.className='auth-msg err'}else{note.textContent='Contraseña cambiada. Ya puedes usar la app.';note.className='auth-msg';setTimeout(()=>location.reload(),1200)}}},h('b',null,'Nueva contraseña'),h('label',{for:'au_new'},'Contraseña (mínimo 8 caracteres)'),pw,h('button',{type:'submit',class:'btn-acc',style:'margin-top:8px'},'Guardar'),note)))}
$('#outBtn').addEventListener('click',()=>S.sb&&S.sb.auth.signOut());
boot();
</script>
