<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout idea: gold rail on the left, dark working surface, dense Airtable-like lists driven by config. */
:root{
  --page:#0a0a0a;--band:#141414;--chrome:#0f0f0f;--border:#3a3a3a;--line:#2a2a2a;
  --text:#fafafa;--text2:#9a9a9a;--hover:#161616;--accent:#d4af37;--accent-ink:#0a0a0a;--link:#6cb6ff;
  --sel:#d4af3724;--danger:#e5484d;--ok:#20c933;--chip-bg:#24262b;--chip-fg:#aab2c0;
  --rail:#d4af37;--rail-ink:#0a0a0a;--rail-hover:#0000001a;--rail-active:#00000029;
  --good-bg:#1d4a2a;--bad-bg:#5a2024;--warn-bg:#5a4212;--scrim:#00000099;
  --font:"Geist",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-t="light"]{
  --page:#fff;--band:#f4f4f4;--chrome:#fff;--border:#c4c4c4;--line:#e4e4e4;--text:#0a0a0a;--text2:#5c5c5c;
  --hover:#f5f5f5;--sel:#d4af372e;--chip-bg:#eef0f6;--chip-fg:#3d4759;--good-bg:#dff5e3;--bad-bg:#fde3e4;--warn-bg:#fdefd2;--link:#0b62c4;--scrim:#00000059;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font:13px/1.45 var(--font);display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--border);padding:6px 10px;color:var(--text)}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
input,select,textarea{background:var(--chrome);border:1px solid var(--border);padding:6px 8px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn-acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-acc:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{color:var(--danger);border-color:var(--danger)}

/* rail */
#rail{width:232px;flex:none;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;height:100%}
#rail .brand{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:15px}
#rail .logo{width:24px;height:24px;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-size:12px;font-weight:700}
#rail nav{flex:1;overflow:auto;padding:4px 8px 12px}
#rail .sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 8px 6px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
#rail a.nav{display:flex;gap:10px;align-items:center;color:var(--rail-ink);padding:8px 10px 8px 28px;font-weight:500;border-left:3px solid transparent}
#rail a.nav:hover{background:var(--rail-hover);text-decoration:none}
#rail a.nav.on{background:var(--rail-active);border-left-color:var(--rail-ink);font-weight:700}
#rail .soon{padding:7px 10px 7px 28px;opacity:.55;display:flex;justify-content:space-between}
#rail .soon small{font-size:10px;border:1px solid currentColor;padding:0 5px}
#rail .me{border-top:1px solid #00000026;padding:12px 14px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
#rail .me .who{flex:1;min-width:120px;overflow-wrap:anywhere}
#rail .me button{border-color:#00000040;color:var(--rail-ink);padding:4px 8px;font-size:12px}
#rail .me button:hover{background:var(--rail-hover)}
#rail .av{width:28px;height:28px;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
#scrim{display:none}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--chrome);flex:none}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{color:var(--text2);font-size:12px}
header .sp{flex:1}
#menuBtn{display:none}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;background:var(--chrome)}
.tabs a{color:var(--text2);padding:8px 14px;border:1px solid transparent;border-bottom:none;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs a.on{color:var(--text);font-weight:600;border-color:var(--line);background:var(--page)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#view{flex:1;overflow:auto;padding:0 0 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.fbtn{display:flex;gap:6px;align-items:center;padding:6px 10px;max-width:100%}
.fbtn b{font-weight:600}.fbtn span.op{color:var(--text2)}
.badge{background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:0 5px;margin-left:4px}
.plain{border-color:transparent}
.chip{display:inline-block;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 3px 1px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.g{background:var(--chip-bg);color:var(--chip-fg);font-weight:500}
.muted{color:var(--text2)}
.empty{padding:28px 16px;color:var(--text2)}
.foot{position:sticky;bottom:0;background:var(--chrome);border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--text2);margin-top:8px}
.foot b{color:var(--text)}

/* list */
.lv{min-width:100%;width:max-content}
.lhead,.lrow{display:grid;grid-template-columns:var(--cols);align-items:stretch;border-bottom:1px solid var(--line)}
.lhead{position:sticky;top:0;background:var(--band);z-index:2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);font-weight:600}
.lhead>div,.lrow>div{padding:8px 10px;border-right:1px solid var(--line);min-width:0;overflow:hidden}
.lrow>div{max-height:66px;overflow:hidden;overflow-wrap:anywhere}
.lv.rh-short .lrow>div{max-height:38px;white-space:nowrap;text-overflow:ellipsis}
.lv.rh-short .lrow>div>span:last-child{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.lv.rh-short .lrow .t span{white-space:nowrap}
.lv.rh-short .lrow>div>span:last-child>*{flex:none}
.lv.rh-tall .lrow>div{max-height:none}
.lv.rh-tall .lrow>div>span:last-child{display:flex;gap:4px;flex-wrap:wrap}
.lrow:hover{background:var(--hover)}
.lrow .t{font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.lrow .t span{overflow:hidden;text-overflow:ellipsis}
.lrow .t button{padding:1px 6px;font-size:11px;flex:none;opacity:.6}
.lrow:hover .t button{opacity:1}
.cell[data-e]{cursor:cell}
.cell.ro{color:var(--text2)}
.cell.good{background:var(--good-bg)}.cell.bad{background:var(--bad-bg)}.cell.warn{background:var(--warn-bg)}
.selc{display:flex;align-items:flex-start;justify-content:center;padding:10px 0!important}.selc input{width:auto;margin:0}
.lrow.picked{background:var(--sel)}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--accent);color:var(--accent-ink);flex-basis:100%}
.bulkbar button{background:var(--chrome);color:var(--text)}
.alertbar{position:sticky;left:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bad-bg);border-bottom:1px solid var(--line);font-size:13px}
.navbadge{margin-left:auto;background:#f82b60;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px}
.sres{max-height:60vh;overflow:auto;margin-top:8px}.sres .sh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding:8px 4px 4px}
.sres .si{display:flex;gap:8px;align-items:center;padding:7px 8px;cursor:pointer;border-radius:4px}.sres .si:hover,.sres .si.on{background:var(--hover)}.sres .si small{color:var(--text2);margin-left:auto}
.grip{cursor:grab;border:none;background:none;font-size:18px;line-height:1;color:var(--text2);padding:4px 8px;justify-self:start}.grip:active{cursor:grabbing}
.fe-row.dragging{opacity:.4}.fe-row.dropt{box-shadow:inset 0 3px 0 var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel)}
.lrow.editing>div{background:var(--sel);box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.lrow .cell a{color:var(--link,#4da3ff);text-decoration:underline;text-underline-offset:2px}
.pop.longpop{position:fixed;z-index:60;padding:0;max-width:none;max-height:none;overflow:hidden;display:flex;flex-direction:column}.pop.longpop textarea{min-width:0}
.lp-head{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.lp-tools{display:flex;gap:4px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}.lp-tools button{min-width:32px}
.tp-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.agrid{display:grid;min-width:max-content}.agrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}
.agrid .ah{position:sticky;top:var(--tbh,0px);z-index:3;background:var(--chrome);font-weight:700;padding:10px}.agrid .ah.now{color:var(--accent)}
.agrid .agrp{position:sticky;left:0;background:var(--hover);font-weight:700;padding:8px 10px;display:flex;gap:6px;align-items:center}
.agrid .aacc{position:sticky;left:0;z-index:2;background:var(--chrome);padding:10px}
.adayh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2);margin-bottom:4px}.adayh button{border:none;background:none;padding:0 4px;font-size:16px;color:var(--text2);cursor:pointer}
.acard{display:flex;gap:8px;align-items:center;padding:5px;margin-bottom:5px;border-left:4px solid transparent;cursor:pointer;min-height:52px;width:100%;text-align:left;border-top:none;border-right:none;border-bottom:none;font:inherit;color:inherit}
.acard.done{background:var(--good-bg);border-left-color:#20c933}.acard.miss{background:var(--bad-bg);border-left-color:#f82b60}.acard.set{background:var(--hover);border-left-color:#2d7ff9}.acard.open{background:var(--warn-bg);border-left-color:#fcb400;border-left-style:dashed}
.acard .th{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--chrome);border:1px solid var(--line);overflow:hidden;font-size:16px;cursor:pointer;padding:0;color:inherit}.acard .th img{width:100%;height:100%;object-fit:cover}
.acard .tx{min-width:0;flex:1}.acard .tx>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acard .k{display:inline-block;border:1px solid var(--line);padding:0 5px;font-size:11px;font-weight:700;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line)}.seg button{border:none;background:none;padding:8px 14px}.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.vpick{max-height:240px;overflow:auto;border:1px solid var(--line)}.vpick .opt{display:flex;gap:8px;align-items:center;padding:8px}.vpick .opt.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.okbox{border:1px solid #20c933;background:var(--good-bg);padding:10px 12px;margin:8px 0}
.toolbar.stick{position:sticky;top:0;left:0;z-index:4;background:var(--chrome)}
.lhead{top:var(--tbh,0px)}
.lhead>div{position:relative;overflow:visible}
.rsz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.rsz:hover,.rsz.on{background:var(--accent);opacity:.6}
body.resizing{cursor:col-resize;user-select:none}
.plat{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;flex:none;line-height:1;font-family:system-ui,sans-serif}
.pfp{width:36px;height:36px;object-fit:cover;border-radius:4px;display:block}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.chip.accchip{display:inline-flex;gap:6px;align-items:center;max-width:100%}
.lrow .t .nm{display:flex;gap:8px;align-items:center;min-width:0}
.pop .search{width:100%;margin:0 0 4px}
.pop.wide{max-width:520px;min-width:300px}
.sortrow{display:flex;gap:6px;align-items:center;padding:4px 2px}.sortrow select{flex:1;min-width:140px}
.pickbtn{display:flex;flex-wrap:wrap;gap:4px;align-items:center;width:100%;min-height:32px;text-align:left;padding:4px 8px}
.tree{border-left:3px solid var(--accent);margin:0 0 8px 12px}
.lrow.sub .t .nm{padding-left:22px}
.prow .t{font-size:15px}
.tw{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--accent);border-radius:50%;font-size:10px;cursor:pointer;flex:none;background:none;padding:0}
.cell input,.cell select{padding:3px 6px}
.grp{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--band);border-bottom:1px solid var(--line);position:sticky;left:0;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.grp.l1{padding-left:28px;background:var(--chrome)}
.grp.l2{padding-left:44px;background:var(--chrome)}
.grp .sum{margin-left:8px;text-transform:none;letter-spacing:0}
.addrow{padding:8px 12px;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--line);position:sticky;left:0;width:max-content}
.addrow:hover{color:var(--accent)}
.lbl{display:none}

/* popover + modal */
.fe-list{max-height:52vh;overflow:auto;border:1px solid var(--line);margin-bottom:10px}
.fe-row{display:grid;grid-template-columns:44px 54px 1fr 80px 50px 120px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.fe-row.op-row{grid-template-columns:64px 44px 1fr auto 36px}
.fe-row input[type=checkbox]{width:auto;justify-self:center}.fe-row input[type=color]{width:36px;height:26px;padding:0;border:none;background:none}
.fe-head{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--chrome);z-index:1}
.fe-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.fe-add input{flex:1;min-width:160px}
.pop{position:fixed;z-index:50;background:var(--chrome);border:1px solid var(--border);min-width:200px;max-width:320px;max-height:340px;overflow:auto;box-shadow:0 12px 32px #0008;padding:6px}
.pop label,.pop .opt{display:flex;gap:8px;align-items:center;padding:5px 8px;cursor:pointer}
.pop label:hover,.pop .opt:hover{background:var(--hover)}
.pop input[type=checkbox]{width:auto}
.pop .row{display:flex;gap:6px;padding:6px 4px 2px}
#modal{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
#modal.on{display:flex}
.dlg{background:var(--chrome);border:1px solid var(--border);width:min(720px,100%);padding:18px 20px}
.dlg h2{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.dlg .f{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.dlg .f>label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding-top:7px}
.dlg .f input[type=checkbox]{width:auto;margin-top:8px}
.dlg .acts{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--page);padding:8px 14px;z-index:60;display:none;font-weight:600;max-width:90vw}

/* plan, cards, calendar, board */
.wrap{padding:16px;max-width:1100px}
.wrap h2{font-size:20px;margin:22px 0 10px}
.anchors{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;left:0;z-index:5;background:var(--chrome)}
.rich{border:1px solid var(--border);background:var(--chrome)}
.rich .bar{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.rich .bar button{border-color:transparent;padding:3px 9px}
.rich .ed{min-height:160px;padding:12px 14px;outline:none;line-height:1.6}
.hint{color:var(--text2);font-size:12px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{border:1px solid var(--line);background:var(--band);padding:12px 14px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi input{font-size:20px;font-weight:700;padding:2px 6px;background:transparent;border-color:transparent}
.kpi input:hover,.kpi input:focus{border-color:var(--border)}
.kpi .row{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
.kpi .row input{font-size:12px;font-weight:500;width:110px}
table.simple{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.simple th,table.simple td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.simple th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);background:var(--band)}
.q{margin:10px 0}.q label{display:block;font-weight:600;margin-bottom:4px}.q textarea{min-height:56px}
.week{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.week b{font-size:15px;min-width:130px;text-align:center}
.day{border:1px solid var(--line);margin:8px 12px}
.day>h3{margin:0;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;background:var(--band)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;padding:6px}
.cards:empty{display:none}
.card{background:var(--band);border-left:3px solid var(--accent);padding:8px 10px;cursor:pointer}
.card:hover{background:var(--hover)}
.card b{display:block}.card small{color:var(--text2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;padding:12px;overflow-x:auto}
.bcol{border:1px solid var(--line);background:var(--chrome);min-height:120px}
.bcol>h3{margin:0;padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.bcol .card{margin:6px}
.chart{padding:14px 16px}
.bar-row{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;margin:6px 0;font-variant-numeric:tabular-nums}
.bar-row .track{background:var(--band);height:18px}.bar-row .fill{background:var(--accent);height:100%}
.bar-row .n{text-align:right}


/* model app (Content Hub) */
body.mview #rail,body.mview header,body.mview .tabs{display:none}
body.mview #view{padding:0;background:#f7f5ef}
body.mview .dlg{background:#fff;color:#1d2340;border-color:#ece7da}
body.mview .dlg .muted{color:#7a7f8f}
body.mview .dlg button{color:#1d2340;border-color:#d9d3c2}
body.mview .dlg .btn-acc{color:#fff;background:#232a4a;border-color:#232a4a}
.ma{--ma-bg:#f7f5ef;--ma-card:#fff;--ma-ink:#1d2340;--ma-sub:#7a7f8f;--ma-gold1:#c9a94e;--ma-gold2:#e8d9a0;--ma-navy:#232a4a;--ma-line:#ece7da;--ma-red:#e5484d;--ma-redbg:#fdecec;color:var(--ma-ink);background:var(--ma-bg);min-height:100%;font:14px/1.45 var(--font);color-scheme:light;padding-bottom:110px}
.ma-top{background:var(--ma-navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;position:sticky;top:0;z-index:5}
.ma .ma-top button{border:none;color:#fff;background:none;padding:5px 10px}
.ma .ma-top button:hover{background:#ffffff1f}
.ma .ma-top .done{background:#2fb36d;border-radius:999px;padding:6px 18px;font-weight:600}
.ma .ma-top .done:hover{background:#28a060}
.ma-hero{background:linear-gradient(135deg,var(--ma-gold1),var(--ma-gold2));padding:22px 16px 18px}
.ma-wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

function ink(hex){if(!hex)return'';const c=hex.replace('#','');const f=c.length===3?c.split('').map(x=>x+x).join(''):c;const r=parseInt(f.slice(0,2),16),g=parseInt(f.slice(2,4),16),b=parseInt(f.slice(4,6),16);return(r*299+g*587+b*114)/1000>140?'#0a0a0a':'#fff'}

const S={d:{},db:null,mode:'loading',q:{}};

function put(c,id,data,quiet){const row={...data,id};const prev=S.d[c].get(id);S.d[c].set(id,row);try{afterPut(c,row,prev)}catch(e){}if(!quiet)rerender();
  if(S.mode==='sb')return sbPut(c,row);

const sbRec=(c,row)=>({col:c,id:String(row.id),model:c==='models'?String(row.id):(row.model||null),data:clean(row),updated_at:new Date().toISOString()});
function sbPut(c,row){const p=c+'/'+row.id;const rec=sbRec(c,row);
  S.q[p]=(S.q[p]||Promise.resolve()).then(async()=>{const {error}=S.role==='model'?await S.sb.from('docs').insert(rec):await S.sb.from('docs').upsert(rec);if(error)toast('No se pudo guardar: '+error.message)}).catch(()=>toast('No se pudo guardar. Revisa tu conexión.'));return S.q[p]}
async function sbLoad(){const all=[];

    const role=h('select',{'aria-label':'Rol de '+(p.email||''),disabled:isMe},['model','admin'].map(r=>h('option',{value:r,selected:p.role===r},r==='admin'?'Admin (todo el CRM)':'Modelo (solo su app)')));
    const mod=h('select',{'aria-label':'Creadora de '+(p.email||'')},h('option',{value:''},'— sin asignar —'),rows('models').map(m=>h('option',{value:m.id,selected:p.model_id===m.id},m.name)));
    const nm=h('input',{value:p.display_name||'',placeholder:'Nombre y apellido','aria-label':'Nombre de '+(p.email||'')});
    body.append(h('tr',null,h('td',null,p.email||'—',isMe?h('span',{class:'muted'},' (tú)'):null),h('td',null,nm),h('td',null,role),h('td',null,mod),h('td',null,h('button',{type:'button',class:'btn-acc',onclick:async()=>{const {error}=await S.sb.from('profiles').update({display_name:nm.value.trim()||null,role:role.value,model_id:mod.value||null}).eq('user_id',p.user_id);if(error)toast('No se pudo guardar: '+error.message);else{toast('Acceso guardado');accRows=null;S.sb.from('profiles').select('user_id,email,display_name,role').then(({data})=>{S.people=data||[]});rerender()}}},'Guardar'))))});
  root.append(h('div',{class:'wrap',style:'max-width:none'},
    newAccessForm(),
    h('p',{class:'muted',style:'max-width:70ch'},'Solo tú creas las cuentas. Rellena email, contraseña y creadora, pulsa “Crear acceso” y pásale esos datos a la persona. Una Modelo solo ve su app y el contenido de la creadora asignada.'),
    h('div',{style:'overflow-x:auto'},h('table',{class:'simple'},h('thead',null,h('tr',null,h('th',null,'Email'),h('th',null,'Nombre'),h('th',null,'Rol'),h('th',null,'Creadora'),h('th',null,''))),body)),
    h('div',{class:'toolbar',style:'border:none;padding:10px 0'},h('button',{type:'button',onclick:()=>{accRows=null;rerender()}},'Actualizar lista'))))}

/* ---------- settings + import ---------- */
function settingsModal(){const s=settings();const name=h('input',{id:'set_name',value:s.agency||''}),me=h('input',{id:'set_me',value:s.me||''});const status=h('div',{class:'hint'});
  const file=h('input',{id:'set_file',type:'file',accept:'.json,application/json',onchange:async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const cols=j.collections||{};let n=0,total=0;for(const c in cols)if(COLS.includes(c))total+=(cols[c]||[]).length;
        const writeOne=async(c,r)=>{const row={...r,id:String(r.id)};S.d[c].set(row.id,row);if(S.mode==='db'){let tries=0;for(;;){try{await S.db.collection(c).doc(row.id).set(clean(row));break}catch(err){if(++tries>6)throw err;await new Promise(z=>setTimeout(z,1500*tries))}}}};
        if(S.mode==='sb'){for(const c in cols){if(!COLS.includes(c))continue;const list=(cols[c]||[]).filter(r=>r&&r.id!=null).map(r=>({...r,id:String(r.id)}));for(let i=0;i<list.length;i+=300){const chunk=list.slice(i,i+300);const {error}=await S.sb.from('docs').upsert(chunk.map(r=>sbRec(c,r)));if(error)throw error;chunk.forEach(r=>S.d[c].set(r.id,r));n+=chunk.length;status.textContent='Importing… '+n+' / '+total}}status.textContent='Imported '+n+' records.';rerender();return}
        for(const c in cols){if(!COLS.includes(c))continue;const list=(cols[c]||[]).filter(r=>r&&r.id!=null);for(let i=0;i<list.length;i+=15){await Promise.all(list.slice(i,i+15).map(r=>writeOne(c,r)));n+=Math.min(15,list.length-i);status.textContent='Importing… '+n+' / '+total;if(n%150<15)rerender()}saveLocal(c)}
        status.textContent='Imported '+n+' records.';rerender()}catch(err){status.textContent='Import stopped after '+n+' records: '+((err&&err.code)||(err&&err.message)||'could not read the file')+'. You can run the same file again — it continues safely.'}}});
  openModal(h('div',{class:'dlg'},h('h2',null,'Settings',h('button',{type:'button',onclick:closeModal,'aria-label':'Close'},'✕')),
    h('div',{class:'f'},h('label',{for:'set_name'},'Agency name'),name),h('div',{class:'f'},h('label',{for:'set_me'},'Your name'),me),
    h('div',{class:'f'},h('label',{for:'set_file'},'Import data'),h('div',null,file,status,h('div',{class:'hint'},'Loads a CRM export file (.json). Existing records with the same id are replaced.'))),
    h('div',{class:'f'},h('label',null,'Storage'),h('div',{class:'muted'},S.mode==='sb'?'Saved to your Supabase database.':S.mode==='db'?'Saved to this page’s shared database.':'Saved in this browser only.')),
    h('div',{class:'acts'},h('span'),h('button',{type:'button',class:'btn-acc',onclick:()=>{put('settings','main',{...settings(),agency:name.value.trim(),me:me.value.trim()});closeModal()}},'Save'))))}

/* ---------- shell ---------- */
function parseHash(){const x=(location.hash||'').replace('#','');if(!x)return;const p=Object.keys(PAGES).sort((a,b)=>b.length-a.length).find(k=>x===k||x.startsWith(k+'-'));if(p){st.route=p;st.tab=x.length>p.length?x.slice(p.length+1):null}}
function go(route,tab){if(route==='modelapp'&&st.route!=='modelapp')Object.assign(ma,{screen:'home',extra:null,f:{},reset:true});const hsh=route+(tab?'-'+tab:'');if(location.hash!=='#'+hsh){try{location.hash=hsh}catch(e){}}st.route=route;st.tab=tab||null;document.body.classList.remove('open');$('#view').scrollTop=0;render()}
const openSec=ls.get('crm:secs',{});
function render(){
  applyLayout();
  if(S.role==='model'&&S.profile){st.route='modelapp';st.model=S.profile.model_id}
  if(S.loaded&&!S.synced&&S.role!=='model'&&S.d.variations){S.synced=true;setTimeout(syncAllVars,0)}
  if(S.loaded&&S.role!=='model')setTimeout(genDaily,0);
  if(!st.keepPop)closePop();const s=settings(),m=model();if(m&&st.model!==m.id){st.model=m.id}
  $('#brandName').textContent=s.agency||'Agency';$('#logo').textContent=(s.agency||'A').slice(0,1).toUpperCase();$('#meName').textContent=(S.profile&&(S.profile.display_name||S.profile.email))||s.me||'Owner';$('#outBtn').style.display=S.sb?'':'none';if(S.profile)$('#meRole').textContent=S.role==='admin'?'Admin':'Modelo';$('#meAv').textContent=(s.me||'ME').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  $('#modelName').textContent=m?m.name:'No creators';
  const lowN=S.role==='model'?0:lowAccounts().length;const nav=$('#nav');nav.replaceChildren();NAV.forEach(([title,keys])=>{const closed=openSec[title]===false;nav.append(h('div',{class:'sec',onclick:()=>{openSec[title]=closed;ls.set('crm:secs',openSec);render()}},title,h('span',null,closed?'▸':'▾')));if(!closed)keys.forEach(k=>nav.append(h('a',{class:'nav'+(st.route===k?' on':''),href:'#'+k,onclick:e=>{e.preventDefault();go(k)}},PAGES[k].icon?h('span',null,PAGES[k].icon):null,PAGES[k].title,k==='pipeline'&&lowN?h('span',{class:'navbadge',title:lowN+' cuentas con menos de 2 días de contenido'},lowN):null)))});
  SOON.forEach(([t,p])=>nav.append(h('div',{class:'sec',style:'cursor:default;opacity:.55'},t,h('small',{style:'font-weight:500;text-transform:none;letter-spacing:0'},p))));
  const page=PAGES[st.route]||PAGES.accounts;$('#title').textContent=page.title;$('#subtitle').textContent=(page.global||!m?'':m.name+' · ')+page.sub;document.title=(s.agency||'Agency')+' CRM';
  const tabs=$('#tabs');tabs.replaceChildren();let tab=null;if(page.tabs){tab=page.tabs.find(t=>t.id===st.tab)||page.tabs[0];page.tabs.forEach(t=>tabs.append(h('a',{href:'#'+st.route+'-'+t.id,class:t===tab?'on':'',onclick:e=>{e.preventDefault();go(st.route,t.id)}},t.dot?h('span',{class:'dot',style:'background:'+t.dot}):null,t.label)));tabs.style.display='flex'}else tabs.style.display='none';
  const v=$('#view');const keep=v.scrollTop,keepX=v.scrollLeft;v.replaceChildren();v.style.setProperty('--tbh','0px');if(S.role!=='model'&&['pipeline','plan','content'].includes(st.route)){const ab=alertBar();if(ab)v.append(ab)}const node=tab||page;const key=st.route+'/'+(tab?tab.id:'');
  if(S.slow)v.append(h('div',{class:'empty',style:'padding:8px 14px'},'The database is taking long to answer. Data shown may be incomplete.'));
  document.body.classList.toggle('mview',node.view==='modelapp');if(node.view==='modelapp')modelApp(v);else if(node.view==='access')accessView(v);else if(node.view==='list')listView(node.cfg,key,v);else if(node.view==='plan')planView(v);else if(node.view==='notes')notesView(v);else if(node.view==='calendar')calendarView(v);else if(node.view==='pipeline')pipelineView(node,v);else if(node.view==='assign')assignView(v);else if(node.view==='analytics')analyticsView(node,v);else if(node.view==='board')boardView(node,v);
  if(node.view==='modelapp'&&ma.reset){ma.reset=false;v.scrollTop=0}else{v.scrollTop=keep;v.scrollLeft=keepX}}
$('#searchBtn').addEventListener('click',()=>{if(S.role!=='model')openSearch()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.role!=='model'){e.preventDefault();openSearch()}});
$('#modelBtn').addEventListener('click',e=>{const ms=rows('models');pop(e.currentTarget,[...ms.map(x=>h('div',{class:'opt',onclick:()=>{st.model=x.id;ls.set('crm:model',x.id);closePop();render()}},x.id===(model()||{}).id?'● ':'○ ',x.name)),ms.length?null:h('div',{class:'opt muted'},'No creators yet'),h('div',{class:'row'},h('button',{type:'button',class:'btn-acc',onclick:()=>{closePop();newRecord(PAGES.creators.cfg)}},'＋ Add creator'))])});
$('#themeBtn').addEventListener('click',()=>{const t=document.body.dataset.t==='dark'?'light':'dark';document.body.dataset.t=t;ls.set('crm:theme',t)});
$('#menuBtn').addEventListener('click',()=>document.body.classList.toggle('open'));
$('#scrim').addEventListener('click',()=>document.body.classList.remove('open'));
$('#setBtn').addEventListener('click',settingsModal);
window.addEventListener('hashchange',()=>{parseHash();render()});
document.body.dataset.t=ls.get('crm:theme','dark');
/* ---------- auth + boot (Vercel + Supabase) ---------- */
function authScreen(mode,msg,isErr){const a=$('#auth');a.classList.add('on');const name=window.AGENCY_NAME||'Agency CRM';
  const email=h('input',{id:'au_email',type:'email',autocomplete:'email',required:true}),pw=h('input',{id:'au_pw',type:'password',autocomplete:mode==='signup'?'new-password':'current-password',required:mode!=='reset',minlength:mode==='signup'?'8':null});
  const note=h('div',{class:'auth-msg'+(isErr?' err':''),role:'status'},msg||'');
  const btn=h('button',{type:'submit',class:'btn-acc',style:'width:100%;padding:10px;margin-top:8px'},mode==='signup'?'Crear cuenta':mode==='reset'?'Enviar email':'Entrar');
  const say=(t,err)=>{note.textContent=t;note.className='auth-msg'+(err?' err':'')};
  const submit=async e=>{e.preventDefault();say('');btn.disabled=true;try{
      if(mode==='reset'){const {error}=await S.sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin});if(error)throw error;say('Te hemos enviado un email para cambiar la contraseña.')}
      else if(mode==='signup'){const {data,error}=await S.sb.auth.signUp({email:email.value.trim(),password:pw.value});if(error)throw error;if(!data||!data.session)say('Cuenta creada. Revisa tu email para confirmarla y después inicia sesión.')}
      else{const {error}=await S.sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error)throw error}
    }catch(x){const m=(x&&x.message)||'';say(m==='Invalid login credentials'?'Email o contraseña incorrectos.':m==='Email not confirmed'?'Confirma tu email antes de entrar (revisa tu bandeja).':(m||'Algo falló. Inténtalo de nuevo.'),true)}finally{btn.disabled=false}};
  a.replaceChildren(h('div',{class:'auth-card'},
    h('div',{class:'auth-head'},h('span',{class:'auth-logo'},name.slice(0,1).toUpperCase()),h('div',null,h('b',{style:'font-size:16px;display:block'},mode==='signup'?'Crear cuenta':mode==='reset'?'Recuperar contraseña':'Iniciar sesión'),h('span',{class:'muted',style:'font-size:12px'},name))),
    h('form',{class:'auth-box',onsubmit:submit},h('label',{for:'au_email'},'Email'),email,mode==='reset'?null:[h('label',{for:'au_pw'},'Contraseña'),pw],btn,note),
    h('div',{class:'auth-links'},mode==='login'?[h('span'),h('button',{type:'button',onclick:()=>authScreen('reset')},'¿Olvidaste la contraseña?')]:h('button',{type:'button',onclick:()=>authScreen('login')},'← Volver a iniciar sesión'))));
  email.focus()}
function gateScreen(title,text){const a=$('#auth');a.classList.add('on');a.replaceChildren(h('div',{class:'auth-card'},h('div',{class:'auth-box'},h('b',{style:'font-size:15px'},title),h('p',{class:'muted',style:'margin:4px 0 10px'},text),h('button',{type:'button',onclick:()=>S.sb.auth.signOut()},'Cerrar sesión'))))}
let starting=false;
async function startSession(session){if(starting||S.user)return;starting=true;
  const {data:prof,error}=await S.sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();starting=false;
  if(error||!prof){gateScreen('No encontramos tu perfil','Si acabas de crear la cuenta, espera unos segundos y vuelve a entrar. Si sigue pasando, contacta con tu agencia.');return}
  S.user=session.user;S.profile=prof;S.role=prof.role;
  if(prof.role==='admin')S.sb.from('profiles').select('user_id,email,display_name,role').then(({data})=>{S.people=data||[];rerender()});
  if(S.role==='model'&&!prof.model_id){gateScreen('Cuenta pendiente de activar','Tu cuenta está creada. Tu agencia tiene que activarla y asignarte tu perfil. Vuelve a entrar cuando te avisen.');return}
  const a=$('#auth');a.classList.remove('on');a.replaceChildren();
  if(S.role==='model')Object.assign(ma,{screen:'home',reset:true});else parseHash();
  render();initStore()}
async function boot(){
  if(!window.SB_URL){parseHash();render();initStore();return}
  if(!window.supabase||!window.supabase.createClient){document.body.replaceChildren(h('div',{class:'empty',style:'margin:auto'},'No se pudo cargar la conexión con la base de datos. Revisa tu conexión y recarga la página.'));return}
  S.sb=window.supabase.createClient(window.SB_URL,window.SB_KEY);
  S.sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){try{history.replaceState(null,'',location.pathname)}catch(e){}location.reload()}else if(ev==='SIGNED_IN'&&session&&!S.user)startSession(session);else if(ev==='PASSWORD_RECOVERY')recoverScreen()});
  const {data}=await S.sb.auth.getSession();if(data&&data.session)startSession(data.session);else authScreen('login')}
function recoverScreen(){const a=$('#auth');a.classList.add('on');const pw=h('input',{id:'au_new',type:'password',autocomplete:'new-password',minlength:'8',required:true});const note=h('div',{class:'auth-msg',role:'status'});
  a.replaceChildren(h('div',{class:'auth-card'},h('form',{class:'auth-box',onsubmit:async e=>{e.preventDefault();const {error}=await S.sb.auth.updateUser({password:pw.value});if(error){note.textContent=error.message;note.className='auth-msg err'}else{note.textContent='Contraseña cambiada. Ya puedes usar la app.';note.className='auth-msg';setTimeout(()=>location.reload(),1200)}}},h('b',null,'Nueva contraseña'),h('label',{for:'au_new'},'Contraseña (mínimo 8 caracteres)'),pw,h('button',{type:'submit',class:'btn-acc',style:'margin-top:8px'},'Guardar'),note)))}
$('#outBtn').addEventListener('click',()=>S.sb&&S.sb.auth.signOut());
boot();
</script>
